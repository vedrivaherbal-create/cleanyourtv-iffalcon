name: Build CleanYourTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Launcher APK
        run: |
          if [ -d "launcher" ]; then
            cd launcher
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Launcher-APK
          path: '**/build/outputs/apk/**/*.apk'
